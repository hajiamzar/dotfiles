[bar.default]
capsule = true
end = [ "tray", "group:g1", "group:g2", "group:g3" ]
margin_ends = 4
start = [ "group:g4", "workspaces" ]

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_container"
    id = "g1"
    members = [ "cpu", "ram" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_container"
    id = "g2"
    members = [ "brightness", "volume", "battery" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_container"
    id = "g3"
    members = [ "bluetooth", "network", "notifications", "clipboard", "widget", "bar", "session" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border_width = 1.0
    enabled = true
    fill = "surface_container"
    id = "g4"
    members = [ "control-center", "launcher" ]
    opacity = 1.0
    padding = 6.0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_container"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_password_reveal = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[plugins]
enabled = [ "vn1k/cursor", "prponkshe/umbriel-displays" ]

[shell]
avatar_path = "/home/haji_amzar/Amzar/Sumber/Gambar/Gambar Disunting/Logo/gruvbox_amzar.png"
polkit_agent = true

[theme]
builtin = "Gruvbox"
mode = "dark"
source = "builtin"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kitty", "qt", "umbriel" ]

[wallpaper]
directory = "/home/haji_amzar/Amzar/Sumber/Gambar/Gambar Dimuat Turun/Kertas Dinding"

    [wallpaper.default]
    path = "/home/haji_amzar/Amzar/Sumber/Gambar/Gambar Dimuat Turun/Kertas Dinding/bukit (4).jpg"

    [wallpaper.last]
    path = "/home/haji_amzar/Amzar/Sumber/Gambar/Gambar Dimuat Turun/Kertas Dinding/bukit (4).jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/haji_amzar/Amzar/Sumber/Gambar/Gambar Dimuat Turun/Kertas Dinding/bukit (4).jpg"

[widget.bar]
type = "prponkshe/umbriel-displays:bar"

[widget.battery]
show_label = true

[widget.brightness]
show_label = true

[widget.clock]
format = "{:%-I:%M %p, %A, %e %B %Y}"

[widget.cpu]
visualization = "none"

[widget.media]
album_art_only = true

[widget.network]
show_label = false

[widget.ram]
stat = "ram_pct"
visualization = "none"

[widget.sysmon]
show_value = true
visualization = "none"

[widget.tray]
drawer = true

[widget.volume]
show_label = true

[widget.widget]
type = "vn1k/cursor:widget"
